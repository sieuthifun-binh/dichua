<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đi Chùa Online - Đạo Tràng 2D Isometric</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #d4af37;
            --deep-wood: #2c1d11;
            --bg-dark: #120a05;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: #f3e5ab;
            font-family: 'Noto Serif JP', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        header {
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            width: 100%;
            background: rgba(18, 10, 5, 0.9);
            z-index: 10;
        }
        header h1 {
            font-family: 'Cinzel', serif;
            color: var(--primary-gold);
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 500px;
            background: #1e1208;
            border: 2px solid var(--primary-gold);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            margin: 10px auto;
            overflow: hidden;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(18, 10, 5, 0.8);
            border: 1px solid var(--primary-gold);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            pointer-events: none;
        }
        .controls-hint {
            text-align: center;
            font-size: 0.8rem;
            color: #d1c7b7;
            padding: 5px;
        }
