<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đi Chùa Online - Đạo Tràng 3D Metaverse</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #d4af37;
            --deep-wood: #2c1d11;
            --bg-dark: #120a05;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: #f3e5ab;
            font-family: 'Noto Serif JP', serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        header {
            position: absolute;
            top: 0; left: 0; width: 100%;
            text-align: center;
            padding: 12px;
            background: rgba(18, 10, 5, 0.7);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            z-index: 10;
            pointer-events: none;
        }
        header h1 {
            font-family: 'Cinzel', serif;
            color: var(--primary-gold);
            font-size: 1.3rem;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        #webgl-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .hud-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(18, 10, 5, 0.8);
            border: 1px solid var(--primary-gold);
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 0.9rem;
            z-index: 10;
            pointer-events: none;
        }
        .controls-info {
            position: absolute;
            top: 65px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: #ffd700;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            z-index: 10;
            pointer-events: none;
        }
        /* Modal tương tác */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #2c1d11;
            border: 2px solid var(--primary-gold);
            padding: 25px;
            border-radius: 12px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
        .close-btn {
            position: absolute;
            top: 8px; right: 14px;
            color: var(--primary-gold);
            font-size: 1.4rem;
            cursor: pointer;
        }
        .btn-action {
            background: var(--primary-gold);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            color: #120a05;
            font-size: 1rem;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <header>
        <h1>🪷 ĐI CHÙA ONLINE - CHÙA 3D METAVERSE 🪷</h1>
    </header>

    <div class="controls-info">
        💡 <b>Điều khiển 3D:</b> Click chuột / chạm để bước đi | Dùng phím <b>W, A, S, D / Mũi tên</b> để di chuyển | Giữ chuột phải để xoay góc nhìn 3D.
    </div>

    <div id="webgl-container"></div>

    <div class="hud-overlay">
        <div>✨ Đạo tràng online: <strong id="online-count">1</strong> Phật tử</div>
        <div>🪘 Tổng Công Đức: <strong id="total-merit">0</strong></div>
    </div>

    <!-- Modal Tương Tác -->
    <div class="modal" id="interaction-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modal-title" style="color: var(--primary-gold); margin-bottom: 10px;">Chính Điện 3D</h3>
            <p id="modal-desc" style="font-size: 0.9rem; color: #d1c7b7;">Thành tâm gõ mõ tích lũy công đức.</p>
            <button class="btn-action" id="modal-action-btn" onclick="performAction()">Gõ Mõ (+1)</button>
        </div>
    </div>

    <!-- Firebase SDK & Engine 3D -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCzbmniWV4SIPRcjFxunVkHvAlOk3YjwIY",
            authDomain: "dichuaonline-9424c.firebaseapp.com",
            databaseURL: "https://dichuaonline-9424c-default-rtdb.firebaseio.com",
            projectId: "dichuaonline-9424c",
            storageBucket: "dichuaonline-9424c.firebasestorage.app",
            messagingSenderId: "118952316543",
            appId: "1:118952316543:web:4f9ecdc00c1b60e178794a",
            measurementId: "G-5XYWKC3BYZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- KHỞI TẠO THREE.JS SCENE 3D ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x120a05);
        scene.fog = new THREE.FogExp2(0x120a05, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Ánh sáng (Lighting)
        const ambientLight = new THREE.AmbientLight(0xffecd1, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffd700, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Đèn hào quang bàn thờ
        const buddhaPointLight = new THREE.PointLight(0xffd700, 2, 15);
        buddhaPointLight.position.set(0, 4, -12);
        scene.add(buddhaPointLight);

        // 1. Vẽ Thềm Đá Chùa 3D (Ground Plane)
        const floorGeo = new THREE.PlaneGeometry(60, 60);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x2c1d11, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 2. Dựng Kiến Trúc Bàn Thờ Phật 3D
        const altarGeo = new THREE.BoxGeometry(8, 2.5, 4);
        const altarMat = new THREE.MeshStandardMaterial({ color: 0x5c2c11, roughness: 0.5 });
        const altar = new THREE.Mesh(altarGeo, altarMat);
        altar.position.set(0, 1.25, -12);
        altar.castShadow = true;
        scene.add(altar);

        // Đài Sen Vàng
        const lotusGeo = new THREE.CylinderGeometry(1.5, 2, 1, 16);
        const lotusMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.6, roughness: 0.3 });
        const lotus = new THREE.Mesh(lotusGeo, lotusMat);
        lotus.position.set(0, 3, -12);
        scene.add(lotus);

        // 3. Lư Hương Đồng 3D
        const burnerGeo = new THREE.CylinderGeometry(0.8, 0.6, 1.2, 12);
        const burnerMat = new THREE.MeshStandardMaterial({ color: 0xb85d19, metalness: 0.8, roughness: 0.2 });
        const burner = new THREE.Mesh(burnerGeo, burnerMat);
        burner.position.set(0, 0.6, -4);
        scene.add(burner);

        // --- HỆ THỐNG MULTIPLAYER REALTIME (FIREBASE) ---
        const userId = 'user_' + Math.random().toString(36).substring(2, 9);
        const userName = 'Phật tử ' + Math.floor(Math.random() * 900 + 100);

        let myPos = { x: 0, z: 10, targetX: 0, targetZ: 10 };
        let playerMeshes = {};
        let totalMerit = 0;

        const myRef = ref(db, 'players3d/' + userId);
        set(myRef, { name: userName, x: myPos.x, z: myPos.z });
        window.addEventListener('beforeunload', () => remove(myRef));

        // Lắng nghe Phật tử 3D online
        onValue(ref(db, 'players3d'), (snapshot) => {
            const playersData = snapshot.val() || {};
            document.getElementById('online-count').innerText = Object.keys(playersData).length;

            // Xóa avatar cũ nếu đã ngắt kết nối
            Object.keys(playerMeshes).forEach(id => {
                if (!playersData[id]) {
                    scene.remove(playerMeshes[id]);
                    delete playerMeshes[id];
                }
            });

            // Cập nhật hoặc tạo mới avatar 3D cho mỗi Phật tử
            Object.keys(playersData).forEach(id => {
                const data = playersData[id];
                if (!playerMeshes[id]) {
                    // Tạo Avatar chú tiểu 3D
                    const avatarGroup = new THREE.Group();
                    
                    // Thân áo chú tiểu
                    const bodyGeo = new THREE.CylinderGeometry(0.4, 0.6, 1.4, 12);
                    const bodyMat = new THREE.MeshStandardMaterial({ color: (id === userId) ? 0xd4af37 : 0xffffff });
                    const body = new THREE.Mesh(bodyGeo, bodyMat);
                    body.position.y = 0.7;
                    body.castShadow = true;
                    avatarGroup.add(body);

                    // Đầu
                    const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
                    const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
                    const head = new THREE.Mesh(headGeo, headMat);
                    head.position.y = 1.6;
                    avatarGroup.add(head);

                    scene.add(avatarGroup);
                    playerMeshes[id] = avatarGroup;
                }

                // Cập nhật vị trí avatar 3D
                playerMeshes[id].position.x = data.x;
                playerMeshes[id].position.z = data.z;
            });
        });

        // Lắng nghe Tổng công đức
        onValue(ref(db, 'room/total_merit'), (snapshot) => {
            totalMerit = snapshot.val() || 0;
            document.getElementById('total-merit').innerText = totalMerit;
        });

        // --- ĐIỀU KHIỂN & DI CHUYỂN ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Di chuyển bằng Chuột / Chạm 3D
        window.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON' || e.target.closest('.modal')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(floor);

            if (intersects.length > 0) {
                myPos.targetX = intersects[0].point.x;
                myPos.targetZ = intersects[0].point.z;
            }
        });

        // Di chuyển bằng Bàn Phím
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // --- VÒNG LẶP RENDER (GAME LOOP) ---
        function animate() {
            requestAnimationFrame(animate);

            // Bàn phím di chuyển
            const speed = 0.15;
            if (keys['w'] || keys['arrowup']) myPos.targetZ -= speed;
            if (keys['s'] || keys['arrowdown']) myPos.targetZ += speed;
            if (keys['a'] || keys['arrowleft']) myPos.targetX -= speed;
            if (keys['d'] || keys['arrowright']) myPos.targetX += speed;

            // Di chuyển mượt (Lerp)
            myPos.x += (myPos.targetX - myPos.x) * 0.1;
            myPos.z += (myPos.targetZ - myPos.z) * 0.1;

            // Đồng bộ tọa độ lên Firebase
            update(myRef, { x: Number(myPos.x.toFixed(2)), z: Number(myPos.z.toFixed(2)) });

            // Camera đi theo avatar của người chơi
            camera.position.x = myPos.x;
            camera.position.y = myPos.z + 8;
            camera.position.z = myPos.z + 12;
            camera.lookAt(myPos.x, 1, myPos.z - 2);

            // Xoay nhẹ đài sen 3D
            lotus.rotation.y += 0.005;

            // Kiểm tra tương tác khi đứng gần Bàn Thờ (Z ~ -12) hoặc Lư Hương (Z ~ -4)
            const distAltar = Math.hypot(myPos.x - 0, myPos.z - (-12));
            const distBurner = Math.hypot(myPos.x - 0, myPos.z - (-4));

            if (distAltar < 3 && document.getElementById('interaction-modal').style.display !== 'flex') {
                openModal('Chính Điện 3D (Gõ Mõ)', 'Thành tâm gõ mõ tích lũy công đức cho đạo tràng.', 'Gõ Mõ (+1 Công Đức)');
            } else if (distBurner < 2.5 && document.getElementById('interaction-modal').style.display !== 'flex') {
                openModal('Lư Hương 3D (Thắp Hương)', 'Dâng nén tâm hương cầu an cho gia đình.', 'Thắp Hương Cầu An');
            }

            renderer.render(scene, camera);
        }

        function openModal(title, desc, btnText) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal-action-btn').innerText = btnText;
            document.getElementById('interaction-modal').style.display = 'flex';
        }

        window.closeModal = function() {
            document.getElementById('interaction-modal').style.display = 'none';
        }

        window.performAction = function() {
            set(ref(db, 'room/total_merit'), totalMerit + 1);
            closeModal();
        }

        // Tự động căn chỉnh khi đổi kích thước màn hình
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
