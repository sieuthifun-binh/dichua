<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đi Chùa Online - Đạo Tràng 2D Isometric</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #d4af37;
            --deep-wood: #2c1d11;
            --bg-dark: #120a05;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: #f3e5ab;
            font-family: 'Noto Serif JP', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        header {
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            width: 100%;
            background: rgba(18, 10, 5, 0.9);
            z-index: 10;
        }
        header h1 {
            font-family: 'Cinzel', serif;
            color: var(--primary-gold);
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 500px;
            background: #1e1208;
            border: 2px solid var(--primary-gold);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            margin: 10px auto;
            overflow: hidden;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(18, 10, 5, 0.8);
            border: 1px solid var(--primary-gold);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            pointer-events: none;
        }
        .controls-hint {
            text-align: center;
            font-size: 0.8rem;
            color: #d1c7b7;
            padding: 5px;
        }
        /* Modal tương tác */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #2c1d11;
            border: 2px solid var(--primary-gold);
            padding: 20px;
            border-radius: 12px;
            max-width: 350px;
            width: 100%;
            text-align: center;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 8px; right: 12px;
            color: var(--primary-gold);
            font-size: 1.3rem;
            cursor: pointer;
        }
        .btn-action {
            background: var(--primary-gold);
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            color: #120a05;
        }
    </style>
</head>
<body>

    <header>
        <h1>🪷 ĐI CHÙA ONLINE - ĐẠO TRÀNG 2D 🪷</h1>
    </header>

    <div class="controls-hint">
        💡 <b>Cách chơi:</b> Click chuột / chạm màn hình để di chuyển avatar đến vị trí mong muốn, hoặc dùng phím <b>W, A, S, D / Mũi tên</b>.
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div class="hud">
            <div>✨ Online: <span id="online-count">1</span> Phật tử</div>
            <div>🪘 Tổng Công Đức: <span id="total-merit">0</span></div>
        </div>
    </div>

    <!-- Modal Gõ Mõ / Tương Tác -->
    <div class="modal" id="interaction-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modal-title" style="color: var(--primary-gold); margin-bottom: 10px;">Bàn Thờ Phật</h3>
            <p id="modal-desc" style="font-size: 0.9rem; margin-bottom: 15px;">Thành tâm hướng thiện, tích lũy công đức.</p>
            <button class="btn-action" id="modal-action-btn" onclick="performAction()">Gõ Mõ (+1)</button>
        </div>
    </div>

    <!-- Firebase SDK & Game Engine -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

        // Cấu hình Firebase của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyCzbmniWV4SIPRcjFxunVkHvAlOk3YjwIY",
            authDomain: "dichuaonline-9424c.firebaseapp.com",
            databaseURL: "https://dichuaonline-9424c-default-rtdb.firebaseio.com",
            projectId: "dichuaonline-9424c",
            storageBucket: "dichuaonline-9424c.firebasestorage.app",
            messagingSenderId: "118952316543",
            appId: "1:118952316543:web:4f9ecdc00c1b60e178794a",
            measurementId: "G-5XYWKC3BYZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Khởi tạo Canvas Game
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const userId = 'user_' + Math.random().toString(36).substring(2, 9);
        const userName = 'Phật tử ' + Math.floor(Math.random() * 900 + 100);
        
        let myState = {
            name: userName,
            x: 400,
            y: 350,
            targetX: 400,
            targetY: 350,
            action: 'Đang đứng'
        };

        let allPlayers = {};
        let totalMerit = 0;

        // Sync vị trí lên Firebase
        const myRef = ref(db, 'players/' + userId);
        set(myRef, myState);
        window.addEventListener('beforeunload', () => remove(myRef));

        // Lắng nghe dữ liệu phòng từ Firebase
        onValue(ref(db, 'players'), (snapshot) => {
            allPlayers = snapshot.val() || {};
            document.getElementById('online-count').innerText = Object.keys(allPlayers).length;
        });

        onValue(ref(db, 'room/total_merit'), (snapshot) => {
            totalMerit = snapshot.val() || 0;
            document.getElementById('total-merit').innerText = totalMerit;
        });

        // Điều khiển bằng Chuột / Chạm
        const container = document.getElementById('game-container');
        container.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            myState.targetX = (e.clientX - rect.left) * (canvas.width / rect.width);
            myState.targetY = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        // Điều khiển bằng Bàn phím
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // Vùng tương tác trong chùa (Khu vực Chính điện, Lư Hương, Thiền Đường)
        const zones = [
            { name: "Chính Điện (Gõ Mõ)", x: 400, y: 120, radius: 50, type: "gomo" },
            { name: "Lư Hương (Thắp Hương)", x: 400, y: 230, radius: 40, type: "thaphuong" },
            { name: "Thiền Đường (Tọa Thiền)", x: 200, y: 350, radius: 50, type: "thienthu" }
        ];

        let activeZone = null;

        // Vòng lặp Game (Game Loop)
        function gameLoop() {
            // Xử lý di chuyển bàn phím
            let speed = 3;
            if (keys['w'] || keys['arrowup']) myState.targetY -= speed, myState.targetY = Math.max(80, myState.targetY);
            if (keys['s'] || keys['arrowdown']) myState.targetY += speed, myState.targetY = Math.min(460, myState.targetY);
            if (keys['a'] || keys['arrowleft']) myState.targetX -= speed, myState.targetX = Math.max(50, myState.targetX);
            if (keys['d'] || keys['arrowright']) myState.targetX += speed, myState.targetX = Math.min(750, myState.targetX);

            // Lerp di chuyển mượt mà đến vị trí đích (Click chuột)
            let dx = myState.targetX - myState.x;
            let dy = myState.targetY - myState.y;
            if (Math.hypot(dx, dy) > 1) {
                myState.x += dx * 0.1;
                myState.y += dy * 0.1;
            }

            // Gửi tọa độ lên Firebase định kỳ (throttle nhẹ)
            update(myRef, { x: Math.round(myState.x), y: Math.round(myState.y) });

            // Kiểm tra đứng gần khu vực tương tác nào không
            activeZone = null;
            zones.forEach(zone => {
                let dist = Math.hypot(myState.x - zone.x, myState.y - zone.y);
                if (dist < zone.radius) {
                    activeZone = zone;
                }
            });

            // Vẽ đồ họa Chùa 2D Isometric
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Vẽ nền sân chùa
            ctx.fillStyle = "#1a0f08";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sân chính điện
            ctx.fillStyle = "#2c1d11";
            ctx.beginPath();
            ctx.roundRect(100, 80, 600, 380, 20);
            ctx.fill();
            ctx.strokeStyle = "#d4af37";
            ctx.lineWidth = 2;
            ctx.stroke();

            // 2. Vẽ các khu vực tương tác (Zones)
            zones.forEach(zone => {
                ctx.beginPath();
                ctx.arc(zone.x, zone.y, zone.radius, 0, Math.PI * 2);
                ctx.fillStyle = (activeZone && activeZone.name === zone.name) ? "rgba(212, 175, 55, 0.4)" : "rgba(212, 175, 55, 0.15)";
                ctx.fill();
                ctx.strokeStyle = "#d4af37";
                ctx.stroke();

                ctx.fillStyle = "#f3e5ab";
                ctx.font = "11px 'Noto Serif JP'";
                ctx.textAlign = "center";
                ctx.fillText(zone.name, zone.x, zone.y - zone.radius - 5);
            });

            // Bàn thờ chính điện
            ctx.fillStyle = "#632d0b";
            ctx.fillRect(350, 90, 100, 40);
            ctx.fillStyle = "#ffd700";
            ctx.font = "12px sans-serif";
            ctx.fillText("⚡ PHÀN ĐÀI ⚡", 400, 115);

            // 3. Vẽ tất cả Phật tử online
            Object.values(allPlayers).forEach(p => {
                ctx.fillStyle = (p.name === userName) ? "#ffd700" : "#ffffff";
                ctx.beginPath();
                ctx.arc(p.x, p.y - 10, 12, 0, Math.PI * 2);
                ctx.fill();

                // Biểu tượng chú tiểu / avatar
                ctx.font = "16px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("🧘", p.x, p.y - 5);

                // Tên người dùng
                ctx.fillStyle = "#f3e5ab";
                ctx.font = "10px sans-serif";
                ctx.fillText(p.name, p.x, p.y + 16);
            });

            // Hiển thị gợi ý tương tác khi đứng gần vùng
            if (activeZone) {
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(canvas.width / 2 - 120, 440, 240, 30);
                ctx.strokeStyle = "#d4af37";
                ctx.strokeRect(canvas.width / 2 - 120, 440, 240, 30);
                ctx.fillStyle = "#ffd700";
                ctx.font = "12px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(`👉 Click để tương tác: ${activeZone.name}`, canvas.width / 2, 460);
            }

            requestAnimationFrame(gameLoop);
        }

        // Mở Modal tương tác khi đứng ở vùng
        canvas.addEventListener('click', () => {
            if (activeZone) {
                openModal(activeZone);
            }
        });

        function openModal(zone) {
            document.getElementById('modal-title').innerText = zone.name;
            document.getElementById('modal-action-btn').innerText = zone.type === 'gomo' ? 'Gõ Mõ (+1 Công Đức)' : (zone.type === 'thaphuong' ? 'Dâng Hương Cầu An' : 'Tịnh Tâm Ngồi Thiền');
            document.getElementById('interaction-modal').style.display = 'flex';
        }

        window.closeModal = function() {
            document.getElementById('interaction-modal').style.display = 'none';
        }

        window.performAction = function() {
            // Cập nhật điểm công đức lên Firebase
            set(ref(db, 'room/total_merit'), totalMerit + 1);
            closeModal();
        }

        // Bắt đầu game loop
        gameLoop();
    </script>
</body>
</html>
